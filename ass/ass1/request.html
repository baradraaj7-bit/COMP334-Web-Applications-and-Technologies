<main>
<h2>Submit a Maintenance Request</h2>
<p>Please provide the following information
  about the problem you are experiencing.
  </p>

  <form action="confirmation.html" method="post" enctype="multipart/form-data">
     <p>
      <label for="name">Full Name:</label>
      <input type="text" name="name" id="name" placeholder="Enter your name">
      </p>
      <p>
      <label for="email">Email Address:</label>
      <input type="email" name="email" id="email" placeholder="Enter your email">
      </p>
      <p>
        <label for="Location">Location/Room Number:</label>
        <input type="text" name="Location" id="Location" placeholder="Enter the room or Location">
      </p>

    <p>
        <label for="Description">Issue Description:</label>
        <textarea name="Description" id="Description" rows="5" cols="30" placeholder="Describe the Issue"></textarea>
      </p>

    <p>
       <label for="Level">Urgency Level:</label>
       <select name="urgency" id="Level">
        <option value="Low">Low</option>
       <option value="Medium">Medium</option>
       <option value="High">High</option>
       </select>   
    </p>
    <p>
    <label for="Photo">Upload a Photo of the Issue (optional):</label>
    <input type="file" name="photo" id="Photo">
    </p>
    <p>
    <input type="submit" value="Submit Request">
    </p>
   </form>
</main>
